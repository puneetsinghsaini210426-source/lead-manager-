{% extends "base.html" %}
{% block title %}Add Lead{% endblock %}
{% block page_title %}Add new lead{% endblock %}
{% block page_subtitle %}Create a customer opportunity and schedule the next step{% endblock %}
{% block content %}
<div class="form-page"><div class="card form-card"><form method="post"><div class="form-grid">
<div class="form-group"><label>Client name *</label><input name="name" value="{{ form.name if form else '' }}" required></div>
<div class="form-group"><label>Mobile number *</label><input name="mobile" value="{{ form.mobile if form else '' }}" required></div>
<div class="form-group"><label>Email</label><input type="email" name="email" value="{{ form.email if form else '' }}"></div>
<div class="form-group"><label>Company</label><input name="company" value="{{ form.company if form else '' }}"></div>
<div class="form-group"><label>Job title</label><input name="job_title" value="{{ form.job_title if form else '' }}"></div>
<div class="form-group"><label>City</label><input name="city" value="{{ form.city if form else '' }}"></div>
<div class="form-group full"><label>Address</label><input name="address" value="{{ form.address if form else '' }}"></div>
<div class="form-group"><label>Product *</label><input name="product" value="{{ form.product if form else '' }}" required></div>
<div class="form-group"><label>Status *</label><select name="status" required>{% for s in statuses %}<option value="{{ s }}" {% if form and form.status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div>
<div class="form-group"><label>Priority</label><select name="priority"><option>Low</option><option selected>Normal</option><option>High</option></select></div>
<div class="form-group"><label>Call type</label><select name="call_type"><option>Call</option><option>Meet</option></select></div>
<div class="form-group"><label>Follow-up date</label><input type="date" name="call_on" value="{{ form.call_on if form else '' }}"></div>
<div class="form-group"><label>Lead source</label><input name="source" placeholder="Website, referral, direct..."></div>
<div class="form-group"><label>Estimated value</label><input type="number" name="estimated_value" min="0" step="0.01"></div>
<div class="form-group"><label>Probability (%)</label><input type="number" name="probability" min="0" max="100" value="0"></div>
<div class="form-group"><label>Owner</label><input name="owner"></div>
<div class="form-group full"><label>Description</label><textarea name="description" placeholder="Add details about this opportunity..."></textarea></div>
<div class="form-group full"><label>Initial follow-up note</label><textarea name="note" placeholder="Write the first note for this lead..."></textarea></div>
</div><div class="form-actions"><a class="btn btn-secondary" href="{{ url_for('leads') }}">Cancel</a><button class="btn btn-primary" type="submit">Create lead</button></div></form></div></div>
{% endblock %}
